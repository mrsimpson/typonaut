<g font-family="monospace" font-size="22"><rect x="60" y="180" width="60" height="60" rx="8" fill="#26305f"/><text x="90" y="220" fill="#ffd166" text-anchor="middle">u</text><rect x="130" y="180" width="60" height="60" rx="8" fill="#26305f"/><text x="160" y="220" fill="#ffd166" text-anchor="middle">r</text></g>
