sections:
  - id: warum
    title:
      de: Warum Zehnfingersystem?
      en: Why touch typing?
    text:
      de: |
        Wer mit allen zehn Fingern tippt und nicht auf die Tastatur schaut, schreibt schneller und macht weniger
        Fehler. Jeder Finger hat seine Tasten und kehrt nach jedem Anschlag zur Grundreihe zurück. Wichtig ist am
        Anfang die Genauigkeit, die Geschwindigkeit kommt mit dem Üben. Kurze Übungen an mehreren Tagen helfen mehr
        als eine lange Stunde.
      en: |
        Typing with all ten fingers without looking at the keyboard is faster and makes fewer mistakes. Every finger
        has its keys and returns to the home row after every keystroke. At the start, accuracy matters most; speed
        comes with practice. Short sessions on several days help more than one long hour.
  - id: quellen
    title:
      de: Quellen
      en: Sources
    text:
      de: |
        Die Reihenfolge der Tasten orientiert sich an der Schulpraxis, zum Beispiel am
        [Leitfaden Tastaturschreiben des Kantons Schwyz](https://www.sz.ch/public/upload/assets/65825/Leitfaden_Tastaturschreiben.pdf)
        (2024). Die Wörter hat der Ersteller der App selbst geschrieben.
      en: |
        The order of the keys follows school practice, for example the
        [Leitfaden Tastaturschreiben of the canton of Schwyz](https://www.sz.ch/public/upload/assets/65825/Leitfaden_Tastaturschreiben.pdf)
        (2024, in German). The words were written by the app's creator.
