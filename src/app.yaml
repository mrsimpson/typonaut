# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/interactive/interactive.v1.schema.json
title:
  de: Typonaut
  en: Typonaut
description:
  de: |
    Lerne das Zehnfingersystem auf einer Reise durch den Weltraum. Kometen mit Wörtern fliegen auf dein Raumschiff zu.
    Tippe sie ab, bevor sie ankommen. Mit jedem Kapitel kommen neue Tasten dazu, von der Grundreihe bis zur ganzen
    Tastatur. Für Kinder ab Klasse 3 und alle, die richtig tippen lernen wollen. Du brauchst eine Tastatur.
  en: |
    Learn touch typing on a journey through space. Comets with words fly towards your spaceship. Type them before they
    arrive. Every chapter adds new keys, from the home row to the whole keyboard. For children from grade 3 and anyone
    who wants to learn to type properly. You need a keyboard.
howto:
  de: |
    - Wähle einen Kurs: Deutsch mit deutscher oder Englisch mit englischer Tastatur.
    - Lege die Finger auf die Grundreihe: links a s d f, rechts j k l ö. Auf f und j fühlst du kleine Erhebungen.
    - Der erste Buchstabe wählt den Kometen. Tippe das ganze Wort, dann zerfällt er zu Sternenstaub.
    - Ein falscher Buchstabe und ein Komet, der ankommt, kosten Energie vom Schutzschild. Ist es leer, versuchst du das Level nochmal.
    - Schau nicht auf die Tastatur. Tippe langsam und genau, das Tempo kommt von allein.
  en: |
    - Choose a course: German with a German keyboard or English with an English keyboard.
    - Put your fingers on the home row: left a s d f, right j k l and the semicolon. You can feel small bumps on f and j.
    - The first letter picks the comet. Type the whole word and it turns into stardust.
    - A wrong letter and a comet that arrives cost energy from the shield. When it is empty, you try the level again.
    - Do not look at the keyboard. Type slowly and carefully, speed will come by itself.
competencies:
  - de: Ich kann meine Finger in die Grundstellung legen und die Grundreihe tippen, ohne zu schauen.
    en: I can put my fingers in the home position and type the home row without looking.
  - de: Ich kann Großbuchstaben mit der Umschalttaste der anderen Hand tippen.
    en: I can type capital letters with the Shift key of the other hand.
  - de: Ich kann jede Taste der Buchstabenreihen mit dem richtigen Finger tippen.
    en: I can type every key of the letter rows with the right finger.
  - de: Ich kann Satzzeichen und Sonderzeichen mit dem richtigen Finger tippen.
    en: I can type punctuation and special characters with the right finger.
  - de: Ich kann Wörter fehlerarm abtippen und merke, welche Tasten mir noch schwerfallen.
    en: I can copy words with few mistakes and notice which keys are still hard for me.
