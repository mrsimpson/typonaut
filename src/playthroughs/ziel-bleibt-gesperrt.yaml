# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/interactive/playthrough.v1.schema.json
# Chapter 5, level 3, two comets in flight: the first letter of the younger one picks it. The first letter of the older one
# is then a wrong key, because the picked comet stays picked until it is typed.
route: de-5
seed: 1
steps:
  - keys: ["3", "Enter"]
    ticks: 265
    state: { phase: play, level: 3, spawned: 2 }
    announce: "Level 3 beginnt. Tippe die fliegenden Wörter ab."
  - keys: ["S"]
    state: { target: 2, errors: 0, last: pick }
  - keys: ["F"]
    state: { target: 2, errors: 1, combo: 0, last: wrong }
  - keys: ["a", "u", "e", "r"]
    state: { target: 0, destroyed: 1, errors: 1, score: 100, last: destroyed }
    announce: "Sauer getroffen. Schild 100 Prozent."
