# Chapter 1, level 1: a wrong key takes 3 percent of the shield and ends the combo; the first letter picks the comet,
# a wrong key after it counts again; the comet then arrives after 11 seconds and takes 11 percent (8 plus 1 per letter).
route: de-1
seed: 1
steps:
  - keys: ["Enter"]
    ticks: 40
    state: { phase: play, spawned: 1 }
  - keys: ["x"]
    state: { errors: 1, shield: 97, combo: 0, last: wrong }
  - keys: ["s", "x"]
    state: { errors: 2, shield: 94, target: 1 }
  - ticks: 560
    state: { missed: 1, shield: 83, last: missed, target: 0 }
    announce: "slk ist angekommen. Schild 83 Prozent."
